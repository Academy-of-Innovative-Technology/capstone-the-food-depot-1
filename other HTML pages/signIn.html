  <script>
    function submitForm() {


      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const number = document.getElementById("number").value.trim();
      const feedback = document.getElementById("feedback").value.trim();

      const selectedRating =
        document.querySelector('input[name="rating"]:checked');

      const rating = selectedRating ? selectedRating.value : "";

      let valid = true;

      document.querySelectorAll(".field-error")
        .forEach(error => error.classList.remove("show"));

      if (name === "") {
        document.getElementById("nameError").classList.add("show");
        valid = false;
      }

      if (email === "") {
        document.getElementById("emailError").classList.add("show");
        valid = false;
      }

      if (number === "") {
        document.getElementById("numberError").classList.add("show");
        valid = false;
      }

      if (!valid) {
        return;
      }


      const feedbackData = {
        name: name,
        email: email,
        phone: number,
        rating: rating,
        feedback: feedback,
        date: new Date().toLocaleString()
      };

      let allFeedback =
        JSON.parse(localStorage.getItem("foodDepotFeedback")) || [];

      allFeedback.push(feedbackData);

      localStorage.setItem(
        "foodDepotFeedback",
        JSON.stringify(allFeedback)
      );

      showToast("Feedback Submitted!");

      document.getElementById("name").value = "";
      document.getElementById("email").value = "";
      document.getElementById("number").value = "";
      document.getElementById("feedback").value = "";

      document
        .querySelectorAll('input[name="rating"]')
        .forEach(radio => {
          radio.checked = false;
        });
    }


    function showToast(message) {

      const toast = document.getElementById("toast");

      toast.textContent = message;

      toast.classList.add("show");

      setTimeout(() => {
        toast.classList.remove("show");
      }, 3000);
    }
  </script>
  <style>
    :root {
      --bodyBg: #fdf8e1;
      --color: #aa1111;
      --hoverColor: #6a7934;
      --buttonColor: #e2e4d7;
      --cardBg: #d5e597;
    }

    @font-face {
      font-family: "KiwiSoda";
      src: url(../fonts/KiwiSoda.ttf);
    }

    @font-face {
      font-family: "lovelyBubbles";
      src: url(../fonts/lovelyBubbles.ttf);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bodyBg);
      font-family: KiwiSoda, Arial, Helvetica, sans-serif;
      color: var(--color);
      font-size: xx-large;
    }

    .container {
      width: 95%;
      max-width: 1400px;
      margin: 0 auto;
    }



    header {
      padding: 20px 0;
    }

    nav {
      display: grid;
      grid-template-columns: 1fr 1fr auto 1fr 1fr;
      align-items: center;
      gap: 20px;
    }

    .nav-btn {
      text-decoration: none;
      text-align: center;
      color: var(--color);
      padding: 12px;
      border-radius: 10px;
      transition: .3s;
    }

    .nav-btn:hover {
      background: var(--buttonColor);
      color: var(--hoverColor);
    }

    .logo-link {
      display: flex;
      justify-content: center;
    }

    .logo-link img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      transition: .3s;
    }

    .logo-link img:hover {
      transform: scale(1.1);
    }



    .page-title {
      font-family: lovelyBubbles, Arial, Helvetica, sans-serif;
      text-align: center;
      margin: 20px 0 40px;
    }

    .page-title h1 {
      font-family: lovelyBubbles, Arial, Helvetica, sans-serif;
      color: var(--color);
      font-size: 2.5rem;
    }

    .page-title p {
      margin-top: 10px;
    }


    .form-section {
      font-family: lovelyBubbles, Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      margin-bottom: 60px;
    }

    .card {
      width: 100%;
      max-width: 700px;

      background: var(--cardBg);

      padding: 40px;

      border-radius: 20px;

      box-shadow: 0 8px 20px rgba(0, 0, 0, .15);
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--color);
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;

      border: 2px solid var(--buttonColor);
      border-radius: 10px;

      font-size: 1rem;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--hoverColor);
    }

    .field-error {
      color: #aa1111;
      font-size: .85rem;
      margin-top: 5px;
      display: none;
    }

    .field-error.show {
      display: block;
    }


    .stars {
      display: flex;
      flex-direction: row-reverse;
      justify-content: flex-end;
    }

    .stars input {
      display: none;
    }

    .stars label {
      font-size: 2rem;
      color: #bbb;
      cursor: pointer;
    }

    .stars label:hover,
    .stars label:hover~label,
    .stars input:checked~label {
      color: gold;
    }


    .btn {
      width: 100%;

      padding: 15px;

      border: none;
      border-radius: 10px;

      background: var(--buttonColor);
      color: var(--color);

      font-weight: bold;
      cursor: pointer;

      transition: .3s;
    }

    .btn:hover {
      background: var(--hoverColor);
      color: white;
    }


    .divider {
      margin: 25px 0;
      border: none;
      border-top: 2px solid rgba(0, 0, 0, .1);
    }

    /* TOAST */

    .toast {
      position: fixed;

      bottom: 20px;
      left: 50%;

      transform: translateX(-50%);

      background: var(--hoverColor);
      color: white;

      padding: 12px 24px;

      border-radius: 30px;

      opacity: 0;
      transition: .3s;
    }

    .toast.show {
      opacity: 1;
    }


    @media (max-width: 768px) {

      nav {
        display: flex;
        flex-direction: column;
      }

      .logo-link {
        order: -1;
      }

      .card {
        padding: 25px;
      }
    }
  </style>
</head>

    <main>

      <section class="page-title">
        <h1>Feedback Form</h1>
        <p>
          Help us improve The Food Depot by sharing your experience.
        </p>
      </section>

      <section class="form-section">

        <div class="card">

          <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Your Name">
            <div class="field-error" id="nameError">
              Please enter your name.
            </div>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="yourname@example.com">

              Please enter a valid email.
            </div>
          </div>

          <div class="field">
            <label for="number">Phone Number</label>
            <input type="tel" id="number" placeholder="(123) 456-7890">
            <div class="field-error" id="numberError">
              Please enter a phone number.
            </div>
          </div>

          <hr class="divider">

          <div class="field">
            <label>Rate Your Experience</label>

            <div class="stars">

              <input type="radio" id="s5" name="rating" value="5">
              <label for="s5">★</label>

              <input type="radio" id="s4" name="rating" value="4">
              <label for="s4">★</label>

              <input type="radio" id="s3" name="rating" value="3">
              <label for="s3">★</label>

              <input type="radio" id="s2" name="rating" value="2">
              <label for="s2">★</label>

              <input type="radio" id="s1" name="rating" value="1">
              <label for="s1">★</label>

            </div>
          </div>

          <div class="field">
            <label for="feedback">
              Additional Feedback
            </label>

            <textarea id="feedback" placeholder="Tell us about your experience..."></textarea>
          </div>

          <button class="btn" onclick="submitForm()">
            Submit Feedback
          </button>

        </div>

      </section>

    </main>

  </div>

  <div class="toast" id="toast"></div>
